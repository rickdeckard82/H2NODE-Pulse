        * `closed` - Fechado
        * `cancelled` - Cancelado
    TokenInputRequest:
      type: object
      properties:
        token:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 128
      required:
      - token
    TransferInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        group:
          type: integer
          minimum: 1
        assignee:
          type: integer
          minimum: 1
        message:
          type: string
          minLength: 1
          maxLength: 8000
      required:
      - assignee
      - expected_version
      - group
      - message
    TransferOption:
      type: object
      properties:
        group:
          type: integer
        group_name:
          type: string
        user:
          type: integer
        user_name:
          type: string
      required:
      - group
      - group_name
      - user
      - user_name
    TransitionInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        action:
          $ref: '#/components/schemas/ActionEnum'
        message:
          type: string
          minLength: 1
          maxLength: 8000
        resolution_class:
          type: string
          minLength: 1
          maxLength: 80
        assignee:
          type: integer
          minimum: 1
      required:
      - action
      - expected_version
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
          title: Endereço de email
        first_name:
          type: string
          readOnly: true
          title: Primeiro nome
        role:
          allOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          readOnly: true
        department:
          type: integer
          readOnly: true
          nullable: true
        is_active:
          type: boolean
          readOnly: true
          title: Ativo
          description: Indica que o usuário será tratado como ativo. Ao invés de excluir
            contas de usuário, desmarque isso.
        mfa_enabled:
          type: boolean
          readOnly: true
      required:
      - department
      - email
      - first_name
      - id
      - is_active
      - mfa_enabled
      - role
    UserCreateInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
        first_name:
          type: string
          minLength: 1
          maxLength: 150
        department:
          type: integer
          nullable: true
        reason:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - email
      - first_name
      - reason
    UserRoleEnum:
      enum:
      - collaborator
      - technician
      - manager
      - admin
      type: string
      description: |-
        * `collaborator` - Colaborador
        * `technician` - Técnico
        * `manager` - Gestor
        * `admin` - Administrador
    UserUpdateInputRoleEnum:
      enum:
      - collaborator
      - technician
      - manager
      - admin
      type: string
      description: |-
        * `collaborator` - collaborator
        * `technician` - technician
        * `manager` - manager
        * `admin` - admin
    VersionInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
      required:
      - expected_version
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
      description: Sessão verificada; MFA exigido em contas que o ativaram. Mutações
        exigem cookie CSRF e cabeçalho X-CSRFToken, inclusive login/cadastro.
