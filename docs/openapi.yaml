components:
  schemas:
    ActionEnum:
      enum:
      - request_information
      - request_test
      - resolve
      - confirm
      - reopen
      - cancel
      - return_queue
      type: string
      description: |-
        * `request_information` - request_information
        * `request_test` - request_test
        * `resolve` - resolve
        * `confirm` - confirm
        * `reopen` - reopen
        * `cancel` - cancel
        * `return_queue` - return_queue
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        comment:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        media_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        scanned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - comment
      - created_at
      - id
      - media_type
      - name
      - scanned_at
      - size
      - status
    AttachmentInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        body:
          type: string
          minLength: 1
          maxLength: 8000
        visibility:
          $ref: '#/components/schemas/CommentVisibilityEnum'
        corrects:
          type: string
          format: uuid
        file:
          type: string
          format: binary
      required:
      - body
      - expected_version
      - file
      - visibility
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        group:
          type: integer
        restricted:
          type: boolean
        is_active:
          type: boolean
      required:
      - group
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        group:
          type: integer
        restricted:
          type: boolean
        is_active:
          type: boolean
      required:
      - group
      - name
    CodeInputRequest:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 64
      required:
      - code
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: integer
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        body:
          type: string
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/CommentVisibilityEnum'
          readOnly: true
        corrects:
          type: string
          format: uuid
          readOnly: true
          nullable: true
      required:
      - actor
      - actor_name
      - body
      - corrects
      - created_at
      - id
      - visibility
    CommentInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        body:
          type: string
          minLength: 1
          maxLength: 8000
        visibility:
          $ref: '#/components/schemas/CommentVisibilityEnum'
        corrects:
          type: string
          format: uuid
      required:
      - body
      - expected_version
      - visibility
    CommentVisibilityEnum:
      enum:
      - public
      - internal
      type: string
      description: |-
        * `public` - Resposta pública
        * `internal` - Nota interna
    CreateInputRequest:
      type: object
      properties:
        category:
          type: integer
          minimum: 1
        subject:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 10000
        impact:
          type: integer
          maximum: 3
          minimum: 1
        urgency:
          type: integer
          maximum: 3
          minimum: 1
        related_ticket:
          type: string
          format: uuid
      required:
      - category
      - description
      - impact
      - subject
      - urgency
    Domain:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        domain:
          type: string
          maxLength: 253
        is_active:
          type: boolean
      required:
      - domain
      - id
    DomainRequest:
      type: object
      properties:
        domain:
          type: string
          minLength: 1
          maxLength: 253
        is_active:
          type: boolean
        reason:
          type: string
          writeOnly: true
          minLength: 1
          maxLength: 300
      required:
      - domain
      - reason
    EmailInputRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 254
      required:
      - email
    Event:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        actor:
          type: integer
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        correlation_id:
          type: string
          format: uuid
          readOnly: true
        action:
          type: string
          readOnly: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/CommentVisibilityEnum'
          readOnly: true
        version:
          type: integer
          readOnly: true
        from_state:
          type: string
          readOnly: true
        to_state:
          type: string
          readOnly: true
        comment:
          allOf:
          - $ref: '#/components/schemas/Comment'
          readOnly: true
          nullable: true
        changes:
          readOnly: true
      required:
      - action
      - actor
      - actor_name
      - changes
      - comment
      - correlation_id
      - created_at
      - from_state
      - id
      - to_state
      - version
      - visibility
    Group:
      type: object
      properties:
        id:
          type: integer
