components:
  schemas:
    CodeInput:
      type: object
      properties:
        code:
          type: string
          writeOnly: true
          maxLength: 64
      required:
      - code
    Domain:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        domain:
          type: string
          maxLength: 253
        is_active:
          type: boolean
        reason:
          type: string
          writeOnly: true
          maxLength: 300
      required:
      - domain
      - id
      - reason
    EmailInput:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
      required:
      - email
    Group:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        is_active:
          type: boolean
      required:
      - id
      - name
    Health:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    IdentityResult:
      type: object
      properties:
        status:
          type: string
        detail:
          type: string
        errors: {}
        csrfToken:
          type: string
        secret:
          type: string
        uri:
          type: string
        recovery_codes:
          type: array
          items:
            type: string
    LoginInput:
