      operationId: tickets_list
      parameters:
      - in: query
        name: assignee
        schema:
          type: integer
          minimum: 1
      - in: query
        name: department
        schema:
          type: integer
          minimum: 1
      - in: query
        name: group
        schema:
          type: integer
          minimum: 1
      - in: query
        name: number
        schema:
          type: integer
          minimum: 1
      - in: query
        name: ordering
        schema:
          enum:
          - -created_at
          - created_at
          - priority
          - -priority
          type: string
          minLength: 1
        description: |-
          * `-created_at` - -created_at
          * `created_at` - created_at
          * `priority` - priority
          * `-priority` - -priority
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: priority
        schema:
          type: integer
          maximum: 4
          minimum: 1
      - in: query
        name: search
        schema:
          type: string
          minLength: 1
          maxLength: 200
      - in: query
        name: state
        schema:
          enum:
          - new
          - in_progress
          - waiting_information
          - waiting_test
          - resolved
          - closed
          - cancelled
          type: string
          minLength: 1
        description: |-
          * `new` - new
          * `in_progress` - in_progress
          * `waiting_information` - waiting_information
          * `waiting_test` - waiting_test
          * `resolved` - resolved
          * `closed` - closed
          * `cancelled` - cancelled
