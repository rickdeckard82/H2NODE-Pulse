components:
  schemas:
    ActionEnum:
      enum:
      - request_information
      - request_test
      - resolve
      - confirm
      - close
      - reopen
      - cancel
      - return_queue
      type: string
      description: |-
        * `request_information` - request_information
        * `request_test` - request_test
        * `resolve` - resolve
        * `confirm` - confirm
        * `close` - close
        * `reopen` - reopen
        * `cancel` - cancel
        * `return_queue` - return_queue
    Attachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        comment:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        media_type:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        scanned_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - comment
      - created_at
      - id
      - media_type
      - name
      - scanned_at
      - size
      - status
    AttachmentInputRequest:
      type: object
      properties:
        expected_version:
          type: integer
          minimum: 1
        body:
          type: string
          minLength: 1
          maxLength: 8000
        visibility:
          $ref: '#/components/schemas/CommentVisibilityEnum'
        corrects:
          type: string
          format: uuid
        file:
          type: string
          format: binary
      required:
      - body
      - expected_version
      - file
      - visibility
    AuditRow:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        actor_id:
          type: integer
          nullable: true
        actor_name:
          type: string
          nullable: true
        actor_email:
          type: string
          nullable: true
        action:
          type: string
        source:
          $ref: '#/components/schemas/SourceEnum'
        subject:
          type: string
        reason:
          type: string
          nullable: true
      required:
      - action
      - actor_email
      - actor_id
      - actor_name
      - created_at
      - reason
      - source
      - subject
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        group:
          type: integer
        restricted:
          type: boolean
        is_active:
          type: boolean
        priority:
          type: integer
          maximum: 4
          minimum: 1
      required:
      - group
      - id
      - name
    CategoryRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        group:
          type: integer
        restricted:
          type: boolean
        is_active:
          type: boolean
        priority:
          type: integer
          maximum: 4
          minimum: 1
      required:
      - group
      - name
    ChannelEnum:
      enum:
      - email
      - chat
      - chat_dm
      type: string
      description: |-
        * `email` - E-mail
        * `chat` - Google Chat
        * `chat_dm` - Google Chat individual
    ChatOutput:
      type: object
      properties:
        enabled:
          type: boolean
        webhook_configured:
          type: boolean
          readOnly: true
        project_number:
          type: string
          maxLength: 32
        app_configured:
          type: boolean
          readOnly: true
        certs_ready:
          type: boolean
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - app_configured
      - certs_ready
      - updated_at
      - webhook_configured
    ClockSummary:
