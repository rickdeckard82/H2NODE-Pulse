name: pulse-services

x-backend: &backend
  image: pulse-services-backend:0.1.0
  build:
    context: .
    dockerfile: backend/Dockerfile
  env_file: .env
  environment: &runtime-env
    BOOTSTRAP_ADMIN_ENABLED: "false"
    BOOTSTRAP_ADMIN_PASSWORD: ""
    POSTGRES_HOST: db
    POSTGRES_USER: pulse_runtime
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_runtime_password
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret_key
    IDENTITY_KEY_FILE: /run/secrets/identity_key
  secrets: [postgres_runtime_password, django_secret_key, identity_key]
  networks: [private]
  init: true
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  mem_limit: 512m
  cpus: 1.0
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulse}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    secrets: [postgres_password, postgres_admin_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [private]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    shm_size: 128mb
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  migrate:
    <<: *backend
    environment:
      <<: *runtime-env
      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED:-false}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, django_secret_key, identity_key]
    command: [sh, -c, "python manage.py migrate --noinput && python manage.py initialize_admin"]
    restart: "no"
    depends_on:
      db: {condition: service_healthy}

  db-permissions:
    image: postgres:17.11-bookworm
    command: [sh, /opt/pulse/runtime-role.sh]
    user: "999:999"
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-pulse}
      PGUSER: postgres
    secrets: [postgres_admin_password, postgres_runtime_password]
    volumes:
      - ./infra/postgres/runtime-role.sh:/opt/pulse/runtime-role.sh:ro
      - ./infra/postgres/runtime-grants.sql:/opt/pulse/runtime-grants.sql:ro
    networks: [private]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    restart: "no"
    depends_on:
      migrate: {condition: service_completed_successfully}
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  api:
    <<: *backend
    volumes: [attachments:/var/lib/pulse/attachments]
    restart: unless-stopped
    depends_on:
      db-permissions: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready/', timeout=6)"]
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    networks: [private, mail_egress]
    volumes: [attachments:/var/lib/pulse/attachments]
    command: [python, manage.py, runworker]
    restart: unless-stopped
    depends_on:
      db-permissions: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/pulse-worker-heartbeat').stat().st_mtime < 30"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Separate on purpose: the application account cannot delete the audit trail.
  # shortcut: reuses the migration credential to avoid a new secret, add a dedicated role later.
  retention:
    <<: *backend
    environment:
      <<: *runtime-env
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password, django_secret_key, identity_key]
    volumes: [attachments:/var/lib/pulse/attachments]
    command: [python, manage.py, runretention]
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped
    depends_on:
      db-permissions: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, python, -c, "import pathlib,time; assert time.time()-pathlib.Path('/tmp/pulse-retention-heartbeat').stat().st_mtime < 120"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  antimalware:
    image: clamav/clamav:1.4@sha256:982e28f90061d0e66eb03276419f589a47c9fa601e985e472fc2f6c64b497ca0
    networks: [private, scanner_updates]
    volumes: [clamav_data:/var/lib/clamav]
    mem_limit: 4g
    cpus: 2.0
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

  gateway:
    image: pulse-services-frontend:0.1.0
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      UPSTREAM_SCHEME: ${UPSTREAM_SCHEME:-http}
      NGINX_ENVSUBST_FILTER: UPSTREAM_SCHEME
    ports: ["${BIND_IP:-127.0.0.1}:${HTTP_PORT:-8086}:8080"]
    networks: [edge, private]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /etc/nginx/conf.d:rw,noexec,nosuid,size=1m,uid=101,gid=101
      - /var/cache/nginx:rw,noexec,nosuid,size=32m,uid=101,gid=101
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}

networks:
  edge: {}
  mail_egress: {}
  scanner_updates: {}
  private:
    internal: true

volumes:
  postgres_data:
  attachments:
  clamav_data:

secrets:
  postgres_admin_password:
    file: ./secrets/postgres_admin_password.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  postgres_runtime_password:
    file: ./secrets/postgres_runtime_password.txt
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  identity_key:
    file: ./secrets/identity_key.txt
