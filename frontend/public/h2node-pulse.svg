<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="H2NODE Pulse" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    .flow { stroke-dasharray: 14 86; animation: flow 2.4s linear infinite; }
    .halo { transform-box: fill-box; transform-origin: center; animation: halo 2.4s ease-out infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-in-out infinite; }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @keyframes halo { 0%, 50% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes beat { 0%, 50%, 100% { transform: scale(1); } 60% { transform: scale(1.2); } }
    @media (prefers-reduced-motion: reduce) { .flow { display: none; } .halo { display: none; } .node { animation: none; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="#0b1022"/>
  <path d="M9 26 h8 l3 6.5 l5 -17 l4.5 13.5 l3 -5 h6.5" fill="none" stroke="url(#g)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- pulso de dados percorrendo a linha entre os dois nós -->
  <path class="flow" d="M9 26 h8 l3 6.5 l5 -17 l4.5 13.5 l3 -5 h6.5" pathLength="100" fill="none" stroke="#e0f2fe" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="9" cy="26" r="4" fill="#a78bfa"/>
  <circle class="halo" cx="39" cy="26" r="4" fill="none" stroke="#22d3ee" stroke-width="1.5"/>
  <circle class="node" cx="39" cy="26" r="4" fill="#22d3ee"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
