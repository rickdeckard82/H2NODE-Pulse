# Dedicated E2E project only: python tests/run_e2e.py. No application data is touched.
services:
  db:
    environment:
      POSTGRES_DB: e2e_pulse
    volumes: !override
      - ./infra/postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    tmpfs: [/var/lib/postgresql/data]
  migrate:
    environment:
      BOOTSTRAP_ADMIN_ENABLED: "false"
      APP_ENV: test
      POSTGRES_DB: e2e_pulse
  db-permissions:
    environment:
      PGDATABASE: e2e_pulse
  api:
    environment:
      APP_ENV: test
      POSTGRES_DB: e2e_pulse
  worker:
    environment:
      APP_ENV: test
      POSTGRES_DB: e2e_pulse
  gateway:
    ports: !override ["127.0.0.1:8081:8080"]
  antimalware:
    profiles: [scanner]
