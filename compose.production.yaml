# Requires .env configured from .env.production.example, and a host firewall that only lets the reverse proxy reach the gateway port.
services:
  api:
    environment:
      APP_ENV: production
  migrate:
    environment:
      APP_ENV: production
  worker:
    environment:
      APP_ENV: production
  retention:
    environment:
      APP_ENV: production
  gateway:
    ports: !override ["${BIND_IP:?Set the private VM IP}:${HTTP_PORT:-8086}:8080"]
    environment:
      UPSTREAM_SCHEME: https
